name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Claude review
    if: vars.CLAUDE_REVIEW_ENABLED == 'true' && vars.CLAUDE_REVIEW_CONFIGURED == 'true'
    runs-on: [self-hosted, logan-gl502vs]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Dario proxy
        id: dario
        run: |
          set -euo pipefail
          GW=""
          if command -v ip >/dev/null 2>&1; then
            GW="$(ip route 2>/dev/null | awk '/default/{print $3; exit}' || true)"
          fi
          for H in host.containers.internal "$GW" 172.18.0.1 172.17.0.1 127.0.0.1; do
            [ -z "$H" ] && continue
            if curl -fsS --max-time 8 \
              -X POST "http://$H:3456/v1/chat/completions" \
              -H 'content-type: application/json' \
              -H 'authorization: Bearer dario' \
              -d '{"model":"claude-haiku-4-5","messages":[{"role":"user","content":"ok"}],"max_tokens":4,"stream":false}' \
              >/dev/null 2>&1; then
              {
                echo "available=true"
                echo "base_url=http://$H:3456"
              } >> "$GITHUB_OUTPUT"
              echo "Dario proxy reachable at $H:3456"
              exit 0
            fi
          done

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Dario proxy (:3456) unreachable from the runner; Claude review skipped."

      - name: Claude review
        id: claude
        if: steps.dario.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.dario.outputs.base_url }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: dario
          claude_args: "--max-turns 25"
          prompt: |
            Review this pull request for ShellDeck and post concise inline review comments. Approve only if it is clean. Focus on, in priority order:

            1. SECURITY - auth bypass, unlock-password handling, IP allowlist mistakes, secret leakage in logs/env examples, unsafe WebSocket/PTY bridging.
            2. CORRECTNESS - tmux attach/capture edge cases, SSE/WebSocket lifecycle, SaaS provisioning paths, config persistence regressions.
            3. PRIVACY / UX - privacy blur/safe-shot regressions, misleading operator-facing copy, breaking changes to env/config without docs.

            Be specific with file:line. Do not nitpick style.

      - name: Report Claude review status
        if: always()
        run: |
          if [ "${{ steps.dario.outputs.available }}" != "true" ]; then
            echo "::warning::Claude review skipped because Dario was unavailable."
          elif [ "${{ steps.claude.outcome }}" = "failure" ]; then
            echo "::warning::Claude review failed; leaving required check green so merge is not blocked by review infrastructure."
          else
            echo "Claude review completed with outcome: ${{ steps.claude.outcome }}"
          fi
