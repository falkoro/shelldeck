name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: Claude review
    if: vars.CLAUDE_REVIEW_ENABLED == 'true' && vars.CLAUDE_REVIEW_CONFIGURED == 'true'
    runs-on: [self-hosted, logan-gl502vs]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Dario proxy
        id: dario
        run: bash .github/scripts/resolve-dario-proxy.sh

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ steps.dario.outputs.base_url }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: dario
          claude_args: "--max-turns 25"
          prompt: |
            Review this pull request for ShellDeck and post concise inline review comments. Approve only if it is clean. Focus on, in priority order:

            1. SECURITY — auth bypass, unlock-password handling, IP allowlist mistakes, secret leakage in logs/env examples, unsafe WebSocket/PTY bridging.
            2. CORRECTNESS — tmux attach/capture edge cases, SSE/WebSocket lifecycle, SaaS provisioning paths, config persistence regressions.
            3. PRIVACY / UX — privacy blur/safe-shot regressions, misleading operator-facing copy, breaking changes to env/config without docs.

            Be specific with file:line. Do not nitpick style.