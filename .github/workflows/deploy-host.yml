name: Deploy host

# Personal ShellDeck (code.falkinator.org) deploys from logan-gl502vs into beefy.
# Spot/work ShellDeck (code.spotcloud.nl) deploys on logan-laptop where the service runs.
# Other spot-techno/* CI uses the spot-tech-ci runner pool.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ShellDeck (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    concurrency:
      group: deploy-host-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: falkinator
            runs-on: [self-hosted, linux, x64, shelldeck-beefy]
            deploy_target: cachy-beefy
            public_urls: https://code.falkinator.org/
          - target: spotcloud
            runs-on: [self-hosted, linux, x64, shelldeck-host]
            deploy_target: logan-laptop
            public_urls: https://code.spotcloud.nl/
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        if: matrix.deploy_target == 'logan-laptop'

      - name: Build, install, restart, and verify public route
        env:
          GITHUB_SHA: ${{ github.sha }}
          SHELLDECK_DEPLOY_TARGET: ${{ matrix.deploy_target }}
          SHELLDECK_PUBLIC_URLS: ${{ matrix.public_urls }}
        run: ./scripts/deploy-host.sh