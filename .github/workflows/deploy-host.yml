name: Deploy host

# Two live ShellDeck hosts:
# - cachy-beefy  -> code.falkinator.org (personal)
# - logan-laptop -> code.spotcloud.nl (Spot/work)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ShellDeck (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    concurrency:
      group: deploy-host-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: falkinator
            runs-on: [self-hosted, linux, x64, shelldeck-beefy]
            deploy_hostname: cachy-beefy
            public_urls: https://code.falkinator.org/
          - target: spotcloud
            runs-on: [self-hosted, linux, x64, shelldeck-host]
            deploy_hostname: logan-laptop
            public_urls: https://code.spotcloud.nl/
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Build, install, restart, and verify public route
        env:
          GITHUB_SHA: ${{ github.sha }}
          SHELLDECK_DEPLOY_HOSTNAME: ${{ matrix.deploy_hostname }}
          SHELLDECK_PUBLIC_URLS: ${{ matrix.public_urls }}
        run: ./scripts/deploy-host.sh