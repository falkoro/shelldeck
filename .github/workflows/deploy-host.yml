name: Deploy host

# Builds and restarts the live ShellDeck service on logan-laptop (CachyOS beefy).
# Serves both code.falkinator.org and code.spotcloud.nl from the same host instance.
# Runs on the dedicated shelldeck-host runner — not logan-gl502vs (personal) or spot-tech-ci (org).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-host
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ShellDeck on logan-laptop
    runs-on: [self-hosted, linux, x64, shelldeck-host]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Build, install, restart, and verify public routes
        env:
          GITHUB_SHA: ${{ github.sha }}
          SHELLDECK_PUBLIC_URLS: https://code.falkinator.org/,https://code.spotcloud.nl/
        run: ./scripts/deploy-host.sh