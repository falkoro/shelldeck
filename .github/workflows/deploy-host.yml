name: Deploy host

# Both dashboards run on logan-laptop and deploy from its host runner (shelldeck-host):
#  - code.falkinator.org → the rootful beefy-personal podman container (deploy-host-beefy.sh).
#  - code.spotcloud.nl   → the systemd --user shelldeck.service.
# Split jobs so the beefy leg never resolves org-private composite actions at setup time.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-falkinator:
    name: Deploy ShellDeck (falkinator)
    runs-on: [self-hosted, linux, x64, shelldeck-host]
    timeout-minutes: 30
    concurrency:
      group: deploy-host-falkinator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Build, install, restart, and verify public route
        env:
          GITHUB_SHA: ${{ github.sha }}
          SHELLDECK_DEPLOY_TARGET: cachy-beefy
          SHELLDECK_BEEFY_HOME: /home/falk/beefy-home
          SHELLDECK_PUBLIC_URLS: https://code.falkinator.org/
        run: ./scripts/deploy-host.sh

  deploy-spotcloud:
    name: Deploy ShellDeck (spotcloud)
    runs-on: [self-hosted, linux, x64, shelldeck-host]
    timeout-minutes: 30
    concurrency:
      group: deploy-host-spotcloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Build, install, restart, and verify public route
        env:
          GITHUB_SHA: ${{ github.sha }}
          SHELLDECK_DEPLOY_TARGET: logan-laptop
          SHELLDECK_PUBLIC_URLS: https://code.spotcloud.nl/
        run: ./scripts/deploy-host.sh