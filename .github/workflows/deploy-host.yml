name: Deploy host

# Personal ShellDeck (code.falkinator.org) deploys from logan-gl502vs into beefy.
# Spot/work ShellDeck (code.spotcloud.nl) deploys on logan-laptop where the service runs.
# Split jobs so the beefy leg never resolves org-private composite actions at setup time.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-falkinator:
    name: Deploy ShellDeck (falkinator)
    runs-on: [self-hosted, linux, x64, shelldeck-beefy]
    timeout-minutes: 30
    concurrency:
      group: deploy-host-falkinator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Build, install, restart, and verify public route
        env:
          GITHUB_SHA: ${{ github.sha }}
          SHELLDECK_DEPLOY_TARGET: cachy-beefy
          SHELLDECK_PUBLIC_URLS: https://code.falkinator.org/
        run: ./scripts/deploy-host.sh

  deploy-spotcloud:
    name: Deploy ShellDeck (spotcloud)
    runs-on: [self-hosted, linux, x64, shelldeck-host]
    timeout-minutes: 30
    concurrency:
      group: deploy-host-spotcloud
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Build, install, restart, and verify public route
        env:
          GITHUB_SHA: ${{ github.sha }}
          SHELLDECK_DEPLOY_TARGET: logan-laptop
          SHELLDECK_PUBLIC_URLS: https://code.spotcloud.nl/
        run: ./scripts/deploy-host.sh