name: Desktop Trial Build

# Unsigned, no-R2 "just let me try it" build. Produces a Windows .exe and a Linux AppImage
# as downloadable GitHub Actions artifacts. Auto-update is disabled here (no signing key),
# so this is purely for trying the app — the real release pipeline is desktop-release.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/shelldeck-desktop
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-trial.yml"

# A trial build never needs signing — disable updater artifacts so no key is required.
env:
  TRIAL_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'

jobs:
  windows:
    name: Windows .exe (trial)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        run: npm ci
      - name: Build NSIS installer (unsigned, no updater)
        run: npm run tauri build -- --bundles nsis --config "$TRIAL_CONFIG"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: shelldeck-desktop-windows-exe
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage (trial)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file wget \
            libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev
      - name: Install desktop dependencies
        run: npm ci
      - name: Build AppImage (unsigned, no updater)
        run: npm run tauri build -- --bundles appimage --config "$TRIAL_CONFIG"
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: shelldeck-desktop-linux-appimage
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
