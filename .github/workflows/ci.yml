name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: [self-hosted, linux, x64, shelldeck-review]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      # Cache bun's global download cache directly. The previous
      # spot-techno/.github/actions/bun-deps-cache@master org action fails to resolve
      # ("Unable to resolve action spot-techno/.github, not found") on the shelldeck-review
      # runner, which red-failed every CI run at the Set up job step.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Frontend typecheck
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run slop:check

      - name: Rust tests
        run: cargo test

      - name: Rust format
        run: cargo fmt --check