name: Grok Review

# PR merge should wait on "Grok merge gate" (spot-tech pattern).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enabled:
    name: Grok review enabled
    runs-on: ubuntu-latest
    outputs:
      run_review: ${{ steps.check.outputs.run_review }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.GROK_REVIEW_ENABLED }}" = "true" ]; then
            echo "run_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_review=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: Grok review (Hermes)
    needs: enabled
    if: needs.enabled.outputs.run_review == 'true'
    runs-on: [self-hosted, linux, x64, shelldeck-review]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Hermes proxy
        id: proxy
        run: |
          set -euo pipefail
          GW=""
          if command -v ip >/dev/null 2>&1; then
            GW="$(ip route 2>/dev/null | awk '/default/{print $3; exit}' || true)"
          fi
          for H in host.containers.internal "$GW" 172.18.0.1 172.17.0.1 127.0.0.1; do
            [ -z "$H" ] && continue
            if curl -fsS --max-time 6 "http://$H:38765/status" >/dev/null 2>&1; then
              {
                echo "available=true"
                echo "url=http://$H:38765/api/v1/messages"
              } >> "$GITHUB_OUTPUT"
              echo "Hermes reachable at $H:38765"
              exit 0
            fi
          done

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Hermes proxy (:38765) unreachable from the runner; Grok review skipped."

      - name: Grok review
        id: grok
        if: steps.proxy.outputs.available == 'true'
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GROK_URL: ${{ steps.proxy.outputs.url }}
        run: python3 scripts/grok-review.py

  merge-gate:
    name: Grok merge gate
    needs: enabled
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Wait for Grok review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.enabled.outputs.run_review }}" != "true" ]; then
            echo "Grok review disabled — merge allowed."
            exit 0
          fi

          DEADLINE=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            CONCLUSION="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == "Grok review (Hermes)") | .conclusion' 2>/dev/null || true)"
            if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "null" ]; then
              echo "Grok review finished ($CONCLUSION) — merge allowed."
              exit 0
            fi
            sleep 20
          done

          echo "15-minute Grok review window elapsed — merge allowed."