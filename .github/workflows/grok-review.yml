# Grok PR review gate. Calls the shared org reviewer in spot-techno/.github.
# Intentionally NOT carrying the "Managed by spot-techno/.github sync-pr-review-workflows"
# header so the weekly sync (which deletes managed caller files) leaves it in place —
# ShellDeck wants this gate to stick. Enable/disable via the GROK_REVIEW_ENABLED repo var.
name: Grok Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.GROK_REVIEW_ENABLED == 'true'
    uses: spot-techno/.github/.github/workflows/reusable-grok-review.yml@master
    secrets: inherit
    with:
      prompt_profile: generic
