name: Publish SaaS image

# Builds the per-customer ShellDeck container (`cargo build --release --features saas`)
# and pushes it to GHCR so the spot-tech-ci VM provisioner can `docker pull` it for each
# tenant. The host install (code.falkinator.org) does NOT use this image — it runs the
# default no-feature build straight from the repo.
#
# Tags: ghcr.io/falkoro/shelldeck:saas (rolling) and :saas-<sha> (pinned).

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "frontend/**"
      - "public/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/publish-saas-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # Only publish from master. A workflow_dispatch on any other ref still builds
          # (validation) but must NOT push the rolling :saas tag or write the shared cache.
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/falkoro/shelldeck:saas
            ghcr.io/falkoro/shelldeck:saas-${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,mode=max' || '' }}
